version: 2

sources:

  # SILVER LAYER
  - name: spark_silver
    description: "Silver Delta Lake tables written by PySpark Structured Streaming"
    schema: market_pulse

    freshness:
      warn_after:
        count: 30
        period: minute
      error_after:
        count: 60
        period: minute
    loaded_at_field: event_time

    tables:
      - name: stocks
        description: "Parsed, typed and deduplicated stock price events"
        external:
          location: "../../data/delta/silver/stocks"
          format: "delta"
        # columns:
        #   - name: ticker
        #     description: "Stock ticker symbol"
        #   - name: open
        #   - name: high
        #   - name: low
        #   - name: close
        #   - name: volume
        #   - name: timestamp
        #   - name: event_time

      - name: news_posts
        description: "Parsed news posts enriched with sentiment scores"
        external:
          location: "../../data/delta/silver/news_posts"
          format: "delta"
        # columns:
        #   - name: id
        #   - name: title
        #   - name: description
        #   - name: content
        #   - name: author
        #   - name: source
        #   - name: url
        #   - name: image_url
        #   - name: published_at
        #   - name: sentiment_polarity
        #   - name: sentiment_subjectivity
          
      - name: fx_rates
        description: "Parsed foreign exchange rate events"
        external:
          location: "../../data/delta/silver/fx_rates"
          format: "delta"
        # columns:
        #   - name: base
        #   - name: target
        #   - name: rate
        #   - name: timestamp
        #   - name: event_time

  # GOLD LAYER
  - name: spark_gold
    description: "Gold Delta Lake tables produced by Spark windowed aggregations"
    schema: market_pulse

    freshness:
      warn_after:
        count: 30
        period: minute
      error_after:
        count: 60
        period: minute
    loaded_at_field: window_end

    tables:
      - name: stock_prices
        description: "5-minute aggregated stock metrics with sentiment"
        columns:
          - name: ticker
            description: "Stock ticker symbol"

          - name: window_start
            description: "Start of the 5-minute window"

          - name: window_end
            description: "End of the 5-minute window"

          - name: avg_close
            description: "Average closing price"

          - name: avg_volume
            description: "Average trading volume"

          - name: avg_sentiment
            description: "Average news sentiment polarity"

          - name: avg_subjectivity
            description: "Average news sentiment subjectivity"